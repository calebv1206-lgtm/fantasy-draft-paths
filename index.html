<!DOCTYPE html>
<html>
<head>
    <style>
<style>

body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 20px;

    background:
        linear-gradient(
            180deg,
            #0a0a0a 0%,
            #111111 50%,
            #000000 100%
        );

    color: white;
    min-height: 100vh;
    position: relative;
}

h1 {
    text-align: center;
    color: #6ccf6c;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #9edb9e;
    margin-bottom: 25px;
    font-size: 18px;
}

#history {
    background:
        linear-gradient(
            180deg,
            #1c2f1c,
            #152515
        );

    padding: 15px;
    border-radius: 12px;

    border: 1px solid #355935;

    box-shadow:
        0 4px 12px rgba(0,0,0,.4);

    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;

    border: none;
    border-radius: 12px;

    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;

    background:
        linear-gradient(
            180deg,
            #3f8a3f,
            #2e7d32
        );

    box-shadow:
        0 4px 8px rgba(0,0,0,.35);

    transition: all .2s ease;
}

button:hover {
    background:
        linear-gradient(
            180deg,
            #4da64d,
            #388e3c
        );

    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}

h3 {
    text-align: center;
    color: #9edb9e;
}

</style>
</style>
    <meta charset="UTF-8">
    <title>Fantasy Draft Assistant</title>
</head>

<body>

<h1>🏈 Fantasy Draft Assistant</h1>

<div class="subtitle">
Draft Path Planner
</div>

<div id="history">
Current Picks:
</div>

<div id="options">
</div>

<script>

const PATHS_URL = "./draftpaths.csv";
const PLAYERS_URL = "./players.csv";

let data = {};
let players = {};

const optionsDiv = document.getElementById("options");
const historyDiv = document.getElementById("history");

let picks = [];

Promise.all([
    fetch(PATHS_URL).then(r => r.text()),
    fetch(PLAYERS_URL).then(r => r.text())
])
.then(([pathsCsv, playersCsv]) => {

    pathsCsv
        .trim()
        .split("\n")
        .slice(1)
        .forEach(row => {

            const cols = row.split("\t");

            const key = cols[0].trim();

            const options = cols
                .slice(1)
                .map(x => x.trim())
                .filter(x => x);

            data[key] = options;
        });

    playersCsv
    .trim()
    .split("\n")
    .slice(1)
    .forEach(row => {

        const cols = row.split(",");

        if (cols.length < 2) return;

        players[cols[0].trim()] =
            cols[1].trim();
    });
    
console.log(players);
console.log(players["A01"]);
console.log(data);
console.log(data["START"]);
    
    showOptions("START");
});

function playerName(id) {
    return players[id] || id;
}

function showOptions(key) {

    optionsDiv.innerHTML = "";

    const options = data[key];

    if (!options || options.length === 0) {
        optionsDiv.innerHTML = "<h3>End of Branch</h3>";
        return;
    }

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.textContent = playerName(option);

        btn.onclick = () => {

            picks.push(playerName(option));

            historyDiv.innerHTML =
                "Current Picks:<br>" +
                picks.join(" → ");

            showOptions(option);
        };

        optionsDiv.appendChild(btn);
    });
}

</script>
    
</body>
</html>
