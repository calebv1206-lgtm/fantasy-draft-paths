<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fantasy Draft Assistant</title>
</head>

<body>

<h1>Fantasy Draft Assistant</h1>

<div id="history">
Current Picks:
</div>

<div id="options">
</div>

<script>

const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo0j4jMPRZJzipHWUU_69kxxNlGv-goTwPbvCsEHgMTGsBe-PPzbipLEE0VXEh6qC41wgnWByMCMDE/pub?output=csv";

const optionsDiv = document.getElementById("options");
const historyDiv = document.getElementById("history");

let picks = [];

function showOptions(key) {

    optionsDiv.innerHTML = "";

    const options = data[key];

    if (!options) {
        optionsDiv.innerHTML = "<h3>End of Branch</h3>";
        return;
    }

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.textContent = option;

        btn.onclick = () => {

            picks.push(option);

            historyDiv.innerHTML =
                "Current Picks:<br>" +
                picks.join(" → ");

            showOptions(option);
        };

        optionsDiv.appendChild(btn);
    });
}

showOptions("START");

</script>

</body>
</html>
