<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fantasy Draft Tree</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

button {
    width: 100%;
    margin: 5px 0;
    padding: 15px;
    font-size: 18px;
}

#history {
    margin-bottom: 20px;
    font-weight: bold;
}
</style>

</head>
<body>

<h1>Fantasy Draft Tree</h1>

<div id="history">
Current Path:
</div>

<div id="options"></div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLZNqaVvmshK7mTgtfDcM-0uOILEaD2UW92QKiOFtiTEfkOx-uNaMAj4xdPgXhGEzsEOwrdnohjUJ/pub?output=csv";

let rows = [];
let currentPath = "";

fetch(SHEET_URL)
.then(r => r.text())
.then(data => {

    rows = data
        .trim()
        .split('\n')
        .slice(1)
        .map(row => row.split(','));

    showOptions("");
});

function showOptions(path){

    document.getElementById("history").innerHTML =
        "Current Path: " + (path || "Start");

    let row;

    if(path === "") {
        row = rows[0];
    } else {
        row = rows.find(r => r[0] === path);
    }

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    if(!row) {
        optionsDiv.innerHTML =
            "<h3>No further recommendations.</h3>";
        return;
    }

    for(let i=1;i<=3;i++){

        if(!row[i]) continue;

        const btn = document.createElement("button");

        btn.textContent = row[i];

        btn.onclick = () => {

            currentPath =
                currentPath
                ? currentPath + ">" + row[i]
                : row[i];

            showOptions(currentPath);
        };

        optionsDiv.appendChild(btn);
    }
}

</script>

</body>
</html>
