<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fantasy Draft Assistant</title>
</head>

<body>

<h1>Fantasy Draft Assistant</h1>

<div id="history">
Current Picks:
</div>

<div id="options">
</div>

<script>

const SHEET_URL = "REPLACE_WITH_GOOGLE_SHEET_CSV_URL";
    
const data = {
    "START": ["A01", "A02", "A03", "A04"],

    "A01": ["B01", "B02", "B03", "B04"],
    "A02": ["B05", "B06", "B07", "B08"],
    "A03": ["B09", "B10", "B11", "B12"],
    "A04": ["B13", "B14", "B15", "B16"]
};

const optionsDiv = document.getElementById("options");
const historyDiv = document.getElementById("history");

let picks = [];

function showOptions(key) {

    optionsDiv.innerHTML = "";

    const options = data[key];

    if (!options) {
        optionsDiv.innerHTML = "<h3>End of Branch</h3>";
        return;
    }

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.textContent = option;

        btn.onclick = () => {

            picks.push(option);

            historyDiv.innerHTML =
                "Current Picks:<br>" +
                picks.join(" → ");

            showOptions(option);
        };

        optionsDiv.appendChild(btn);
    });
}

showOptions("START");

</script>

</body>
</html>
