<!DOCTYPE html>
<html>
<head>
    <style>

body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 20px;
    background-color: #121212;
    color: white;
}

h1 {
    text-align: center;
    color: #2e7d32;
}

#history {
    background-color: #1e1e1e;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    background-color: #00d4ff;
    color: black;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #00a8cc;
}

</style>
    <meta charset="UTF-8">
    <title>Fantasy Draft Assistant</title>
</head>

<body>

<h1>Fantasy Draft Assistant</h1>

<div id="history">
Current Picks:
</div>

<div id="options">
</div>

<script>

const PATHS_URL = "./draftpaths.csv";
const PLAYERS_URL = "./players.csv";

let data = {};
let players = {};

const optionsDiv = document.getElementById("options");
const historyDiv = document.getElementById("history");

let picks = [];

Promise.all([
    fetch(PATHS_URL).then(r => r.text()),
    fetch(PLAYERS_URL).then(r => r.text())
])
.then(([pathsCsv, playersCsv]) => {

    pathsCsv
        .trim()
        .split("\n")
        .slice(1)
        .forEach(row => {

            const cols = row.split("\t");

            const key = cols[0].trim();

            const options = cols
                .slice(1)
                .map(x => x.trim())
                .filter(x => x);

            data[key] = options;
        });

    playersCsv
    .trim()
    .split("\n")
    .slice(1)
    .forEach(row => {

        const cols = row.split(",");

        if (cols.length < 2) return;

        players[cols[0].trim()] =
            cols[1].trim();
    });
    
console.log(players);
console.log(players["A01"]);
console.log(data);
console.log(data["START"]);
    
    showOptions("START");
});

function playerName(id) {
    return players[id] || id;
}

function showOptions(key) {

    optionsDiv.innerHTML = "";

    const options = data[key];

    if (!options || options.length === 0) {
        optionsDiv.innerHTML = "<h3>End of Branch</h3>";
        return;
    }

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.textContent = playerName(option);

        btn.onclick = () => {

            picks.push(playerName(option));

            historyDiv.innerHTML =
                "Current Picks:<br>" +
                picks.join(" → ");

            showOptions(option);
        };

        optionsDiv.appendChild(btn);
    });
}

</script>
    
</body>
</html>
